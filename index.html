<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportStreak</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <h1>SportStreak</h1>
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
      <p class="subtitle">Stay consistent. Build your streak.</p>
    </header>

    <!-- Daily Motivation Quote -->
    <section class="quote-section">
      <p class="quote-label">Today's Motivation</p>
      <p id="daily-quote" class="quote-text">Loading motivation...</p>
    </section>

    <!-- Sports Grid -->
    <section class="sports-grid" id="sports-grid">
      <!-- Cards will be generated by JavaScript -->
    </section>

    <!-- Selected Sport Details -->
    <section class="details-section" id="details-section" style="display: none;">
      <button class="back-btn" id="back-btn">← Back</button>
      
      <div class="sport-header">
        <span class="sport-emoji" id="detail-emoji"></span>
        <h2 id="detail-name"></h2>
      </div>

      <div class="streak-box">
        <p class="streak-label">Current Streak</p>
        <p class="streak-number" id="streak-number">0</p>
        <p class="streak-days">days</p>
      </div>

      <button class="action-btn" id="done-btn">I did it today!</button>
      <p class="status-message" id="status-message"></p>

      <div class="history-section">
        <h3>Recent History</h3>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
